services:

  postgres:
    image: postgres:16
    container_name: question_variation_postgres

    environment:
      POSTGRES_DB: question_variation_db
      POSTGRES_USER: qvs_user
      POSTGRES_PASSWORD: qvs_password

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    restart: unless-stopped


volumes:
  postgres_data: